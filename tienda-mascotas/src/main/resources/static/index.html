<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Mascotas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 shadow rounded">
    <h3 class="mb-4">Mantenimiento de Mascotas</h3>

    <div class="d-flex justify-content-between mb-3">
        <h5>Listado de Mascotas</h5>
        <button class="btn btn-success" onclick="abrirModalNueva()">Nueva</button>
    </div>

    <!-- Tabla de Mascotas -->
    <table class="table table-bordered table-striped text-center">
        <thead class="table-light">
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="tablaMascotas">
        <!-- Aquí se inyectan los datos con AJAX -->
        </tbody>
    </table>
</div>

<!-- ============================================== -->
<!-- MODAL: AGREGAR / EDITAR MASCOTA                -->
<!-- ============================================== -->
<div class="modal fade" id="modalMascota" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo">Agregar Mascota</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formMascota">
                    <input type="hidden" id="mascotaId"> <!-- ID Oculto para saber si editamos -->

                    <div class="mb-3">
                        <label>Nombre:</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre de la mascota" required>
                    </div>
                    <div class="mb-3">
                        <label>Edad:</label>
                        <input type="number" class="form-control" id="edad" placeholder="Ingrese la edad de la mascota" required>
                    </div>
                    <div class="mb-3">
                        <label>Raza:</label>
                        <select class="form-select" id="raza">
                            <option value="Gran Perro">Gran Perro</option>
                            <option value="Perro Pequeño">Perro Pequeño</option>
                            <option value="Gato">Gato</option>
                            <option value="Ave">Ave</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Observaciones:</label>
                        <textarea class="form-control" id="observaciones" rows="3" placeholder="Ingrese las observaciones"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnGuardar" onclick="guardarMascota()">Agregar</button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================== -->
<!-- MODAL: CONFIRMAR ELIMINACIÓN                   -->
<!-- ============================================== -->
<div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Eliminar mascota</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="textoEliminar">¿Está seguro de eliminar la mascota?</p>
                <input type="hidden" id="deleteId">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" onclick="borrarMascota()">Eliminar</button>
            </div>
        </div>
    </div>
</div>

<!-- jQuery (Obligatorio para AJAX) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Tu script de AJAX -->
<script src="/dist/js/jspropios/app.js"></script>

</body>
</html>
